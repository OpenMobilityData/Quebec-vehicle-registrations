  <g id="text_20">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1f2428" x="9.504" y="21.495" transform="rotate(-0 9.504 21.495)">Inferring vehicle type from make, model and model year: error on published years</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #5f6b74" x="9.504" y="39.508" transform="rotate(-0 9.504 39.508)">Automobiles and light trucks: inferred count against the count the SAAQ published, in per cent</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(9.504 328.9689)">Each published year is reduced to the seven columns of the 2023–2024 files, inferred, and compared with the published type. The test uses the open data's own make and model codes; it does not measure the effect of the unedited</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(9.504 337.9164)">codes of 2023–2024.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(9.504 346.8639)">Sources: SAAQ, open data « Véhicules en circulation », 2011–2022 (files of December 18, 2023); SAAQ, files released under the access Act, file 03.06.34729 (decision of September 17, 2025), 2023–2024.</text>
  </g>
  <g id="legend_1">
   <g id="line2d_39">
    <g>
     <use xlink:href="#ma49644d3c7" x="64.62" y="284.076" style="fill: #2a78d6; stroke: #2a78d6"/>
    </g>
   </g>
   <g id="text_23">
    <text style="font-size: 9px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1f2428" x="80.82" y="287.226" transform="rotate(-0 80.82 287.226)">inferred from the three years ending one year earlier (as 2023 from 2020–2022)</text>
   </g>
   <g id="line2d_40">
    <g>
     <use xlink:href="#ma088602f34" x="64.62" y="299.061" style="fill: #ffffff; stroke: #2a78d6; stroke-width: 1.8"/>
    </g>
