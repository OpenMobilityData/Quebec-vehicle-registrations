   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 355.5894)">Nombres de titulaires, non des taux : aucune population n’est utilisée. Les fichiers des permis donnent la MRC, non la municipalité : l’île comprend la Ville de Montréal et les quinze autres municipalités. SAAQ,</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 364.5369)">données ouvertes « Permis de conduire », 2011–2022.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 373.4844)">Sources : SAAQ, données ouvertes « Véhicules en circulation », 2011–2022 (fichiers du 18 décembre 2023) ; SAAQ, fichiers communiqués en vertu de la Loi sur l’accès, dossier 03.06.34729 (décision du 17</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 382.4319)">septembre 2025), 2023–2024.</text>
