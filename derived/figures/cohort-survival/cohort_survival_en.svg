   <g id="text_24">
    <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #1f2428" transform="translate(353.615094 145.5516)">At 15 years:</text>
    <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #1f2428" transform="translate(353.615094 156.2886)">2011–2016  31 %</text>
    <text style="font-size: 9px; font-family: 'Helvetica Neue'; fill: #1f2428" transform="translate(353.615094 167.0256)">2016–2021  42 %</text>
