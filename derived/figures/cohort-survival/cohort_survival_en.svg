  <g id="text_25">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1f2428" x="8.64" y="22.755" transform="rotate(-0 8.64 22.755)">How long automobiles and light trucks stay registered in Québec</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #5f6b74" x="8.64" y="43.792" transform="rotate(-0 8.64 43.792)">Of the vehicles of a model year registered at age 3, the share still registered at each later age, by period</text>
  </g>
  <g id="text_27">
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 378.7641)">Each step compares one model year's count in two consecutive yearly files. Counts for 2023 and 2024 are inferred (type from make, model and model year), so the last period carries that method's error, under 0.2</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 387.7116)">% on published years. A vehicle that leaves Québec counts as a departure; one that arrives used counts as an arrival.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 396.6591)">Sources: SAAQ, open data « Véhicules en circulation », 2011–2022 (files of December 18, 2023); SAAQ, files released under the access Act, file 03.06.34729 (decision of September 17, 2025), 2023–2024.</text>
  </g>
