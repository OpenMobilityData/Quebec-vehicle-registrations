  </g>
  <g id="text_38">
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(9.072 350.3097)">Compound yearly rate between the files of December 31 of the two years. 2011 to 2022 are published counts; 2024 is inferred from make, model and model year (within 0.2 % on published years). « Rest of Québec » is the</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(9.072 359.2572)">province less the five cities shown. The cause of the slower growth after 2021 is not established.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(9.072 368.2047)">Sources: SAAQ, open data « Véhicules en circulation », 2011–2022 (files of December 18, 2023); SAAQ, files released under the access Act, file 03.06.34729 (decision of September 17, 2025), 2023–2024.</text>
  </g>
