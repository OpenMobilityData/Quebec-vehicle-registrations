  <g id="text_23">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1f2428" x="8.64" y="22.755" transform="rotate(-0 8.64 22.755)">Montréal : la tendance de 2011–2021 prolongée, et ce que montrent les fichiers</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #5f6b74" x="8.64" y="43.792" transform="rotate(-0 8.64 43.792)">Automobiles et camions légers, municipalité de Montréal. L’axe ne part pas de zéro.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 369.8166)">La droite n’est pas une prévision : elle montre où menaient les nombres de 2011–2021. 2022 est le nombre publié ; 2023 et 2024 sont inférés de la marque, du modèle et de l’année du modèle (à 0,13 % près sur</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 378.7641)">les années publiées).</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 387.7116)">Sources : SAAQ, données ouvertes « Véhicules en circulation », 2011–2022 (fichiers du 18 décembre 2023) ; SAAQ, fichiers communiqués en vertu de la Loi sur l’accès, dossier 03.06.34729 (décision du 17</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue'; fill: #5f6b74" transform="translate(8.64 396.6591)">septembre 2025), 2023–2024.</text>
  </g>
